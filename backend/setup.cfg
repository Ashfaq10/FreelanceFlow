[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    migrations,
    staticfiles,
    venv,
    .venv
ignore = E501, W503

[isort]
profile = black
line_length = 120
skip = migrations, venv, .venv
known_django = django
known_third_party = celery, rest_framework, allauth, stripe, weasyprint
sections = FUTURE, STDLIB, DJANGO, THIRDPARTY, FIRSTPARTY, LOCALFOLDER

[mypy]
python_version = 3.12
plugins = mypy_django_plugin.main
ignore_missing_imports = True

[mypy.plugins.django-stubs]
django_settings_module = config.settings.local

[coverage:run]
source = apps
omit = 
    */migrations/*
    */tests/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
