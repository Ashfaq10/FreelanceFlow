version: 2
updates:
  # One grouped PR per ecosystem per month: the first ungrouped run opened 17 PRs at once.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: ['*']
        # Django 5.2 LTS is its own migration (OPS-7); monthly bumps stay small.
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Deletion candidates (LEAN-1/LEAN-2): not worth updating.
      - dependency-name: django-allauth
      - dependency-name: django-crispy-forms
      - dependency-name: crispy-tailwind

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ['*']
        # Majors (React 19, Tailwind 4, Vite 8, ESLint 10, react-router 7, recharts 3) are a migration,
        # tracked as OPS-7/OPS-8; a monthly PR must stay reviewable.
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # The Python version is pinned deliberately (.python-version); Django 4.2 supports up to 3.12.
      - dependency-name: python
