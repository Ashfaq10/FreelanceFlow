<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #0ea5e9;">Quote {{ quote.number }}</h2>

    <p>Hi {{ client.name }},</p>
    <p>{{ user.get_display_name }} sent you a quote for {{ currency_symbol }}{{ quote.total }}. It is valid until {{ quote.valid_until }}. The PDF is attached.</p>

    <p style="text-align: center; margin: 30px 0;">
        <a href="{{ public_url }}" style="display: inline-block; background-color: #0ea5e9; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Review and respond
        </a>
    </p>

    <p style="font-size: 12px; color: #666;">Or paste this link into your browser:<br>{{ public_url }}</p>
</body>
</html>
